[metadata]
name = focus-st
version = 0.2.0
description = Multimodal conditional diffusion for spatial transcriptomics enhancement
long_description = file: README.md
long_description_content_type = text/markdown
author = FOCUS contributors
url = https://github.com/LHY1007/FOCUS
license = MIT
license_files = LICENSE
classifiers =
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Operating System :: POSIX :: Linux
    Topic :: Scientific/Engineering :: Bio-Informatics
project_urls =
    Source = https://github.com/LHY1007/FOCUS
    Issues = https://github.com/LHY1007/FOCUS/issues
    Documentation = https://github.com/LHY1007/FOCUS/tree/main/docs

[options]
packages = find:
python_requires = >=3.10
include_package_data = True
install_requires = file: requirements.txt

[options.packages.find]
include =
    guided_diffusion
    guided_diffusion.*
    transform
    transform.*

[options.data_files]
share/focus =
    README.md
    LICENSE
    FOCUS.yaml
share/focus/config =
    config/*.yaml
share/focus/demos =
    demos/run.py
share/focus/demos/input =
    demos/input/*.png
    demos/input/*.npz

[options.extras_require]
dev =
    build>=1.2
    twine>=6
    coverage>=7

[bdist_wheel]
universal = 0
