[metadata]
name = focus-st
version = 0.3.0
description = Multimodal conditional diffusion for spatial transcriptomics enhancement
long_description = file: README.md
long_description_content_type = text/markdown
author = FOCUS contributors
url = https://github.com/LHY1007/FOCUS
license = MIT
license_files = LICENSE
classifiers =
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Operating System :: POSIX :: Linux
    Topic :: Scientific/Engineering :: Bio-Informatics
project_urls =
    Source = https://github.com/LHY1007/FOCUS
    Issues = https://github.com/LHY1007/FOCUS/issues
    Documentation = https://github.com/LHY1007/FOCUS/tree/main/docs

[options]
packages = find:
python_requires = >=3.10
include_package_data = True
install_requires = file: requirements.txt

[options.packages.find]
include =
    guided_diffusion
    guided_diffusion.*
    transform
    transform.*

[options.data_files]
share/focus =
    README.md
    LICENSE
    FOCUS.yaml
share/focus/config =
    config/*.yaml
share/focus/demos =
    demos/run.py
    demos/focus-5gene.pt
    demos/checkpoint_provenance.json
share/focus/demos/input =
    demos/input/*.png
    demos/input/*.npz
    demos/input/provenance.json

[options.extras_require]
preprocessing =
    opencv-python>=4.10,<5
    duckdb>=1.1,<2
    pyometiff>=1,<2
    pyvips[binary]>=3,<4
    spatialdata>=0.6,<0.9
    spatialdata-io>=0.2,<0.8
    zarr>=2.18,<4
    xarray>=2024.10,<2027
    dask>=2024.10,<2027
    scikit-learn>=1.6,<2
downstream =
    scanpy[leiden]>=1.11,<1.12
    rctd-py==0.3.8
    tangram-sc==1.0.4
    shapely>=2,<3
    openslide-python>=1.4,<2
    openslide-bin>=4,<5
    pyarrow>=18,<26
    natsort==8.4.0
    networkx>=3,<4
dev =
    build>=1.2
    twine>=6
    coverage>=7

[bdist_wheel]
universal = 0
